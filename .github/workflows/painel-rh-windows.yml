name: Painel RH - Windows

on:
  push:
    branches: ['claude/**', 'main', 'master']
    tags: ['painel-rh-v*']
    paths: ['painel-rh/**', '.github/workflows/painel-rh-windows.yml']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar uma versão (Release) com o instalador'
        type: boolean
        default: false
      versao:
        description: 'Nome da tag da versão'
        type: string
        default: 'painel-rh-v0.2.1'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: painel-rh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: painel-rh/src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Testes das funções de data (JS)
        run: npm test

      - name: Testes de gravação e backup (Rust)
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Gerar PainelRH.html (arquivo único)
        run: npm run build:html

      - name: Gerar app e instalador
        run: npx tauri build

      - name: Medir RAM e CPU com o app aberto e parado
        shell: pwsh
        run: |
          node scripts/dados-exemplo.mjs "$env:APPDATA\painel-rh"
          ./scripts/medir-ram.ps1 -Exe src-tauri/target/release/painel-rh.exe -Espera 30 -JanelaCpu 60 -Fechar *>&1 | Tee-Object -FilePath medicao-ram.txt
          Get-Content medicao-ram.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Medir RAM e CPU da versão HTML (Edge dedicado só com o painel)
        shell: pwsh
        run: |
          ./scripts/medir-ram.ps1 -Html dist/PainelRH.html -Espera 30 -JanelaCpu 60 -Fechar *>&1 | Tee-Object -FilePath medicao-ram-html.txt
          "`n## Versão HTML (Edge)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content medicao-ram-html.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Juntar arquivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force saida | Out-Null
          Copy-Item src-tauri/target/release/painel-rh.exe "saida/PainelRH-portatil.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe saida/
          Copy-Item dist/PainelRH.html saida/
          Copy-Item scripts/medir-ram.ps1, medicao-ram.txt, medicao-ram-html.txt saida/

      - uses: actions/upload-artifact@v4
        with:
          name: painel-rh-windows
          path: painel-rh/saida/*

      - name: Publicar versão (em tag ou quando pedido manualmente)
        if: startsWith(github.ref, 'refs/tags/painel-rh-v') || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.versao }}
          target_commitish: ${{ github.sha }}
          name: Painel RH ${{ inputs.versao || github.ref_name }}
          prerelease: true
          body: |
            Controle local de prazos: rescisões e férias.
            - **`PainelRH.html`** (recomendado): um único arquivo. Abra no Microsoft Edge com dois cliques. Não instala nada e não é barrado pelo Controle Inteligente de Aplicativos.
            - `Painel RH_..._x64-setup.exe` / `PainelRH-portatil.exe`: versão aplicativo (pode ser barrada pelo Controle Inteligente de Aplicativos por não ter assinatura).
            - `medir-ram.ps1`: mede a RAM. `medicao-ram*.txt`: medições feitas no Windows do GitHub.
          files: painel-rh/saida/*
