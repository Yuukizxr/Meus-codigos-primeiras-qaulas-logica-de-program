name: Painel RH - Windows

on:
  push:
    branches: ['claude/**', 'main', 'master']
    tags: ['painel-rh-v*']
    paths: ['painel-rh/**', '.github/workflows/painel-rh-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: painel-rh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: painel-rh/src-tauri -> target

      - name: Instalar dependências
        run: npm ci

      - name: Testes das funções de data (JS)
        run: npm test

      - name: Testes de gravação e backup (Rust)
        run: cargo test --release --manifest-path src-tauri/Cargo.toml

      - name: Gerar app e instalador
        run: npx tauri build

      - name: Medir RAM e CPU com o app aberto e parado
        shell: pwsh
        run: |
          node scripts/dados-exemplo.mjs "$env:APPDATA\painel-rh"
          ./scripts/medir-ram.ps1 -Exe src-tauri/target/release/painel-rh.exe -Espera 30 -JanelaCpu 60 -Fechar *>&1 | Tee-Object -FilePath medicao-ram.txt
          Get-Content medicao-ram.txt | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Juntar arquivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force saida | Out-Null
          Copy-Item src-tauri/target/release/painel-rh.exe "saida/PainelRH-portatil.exe"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe saida/
          Copy-Item scripts/medir-ram.ps1, medicao-ram.txt saida/

      - uses: actions/upload-artifact@v4
        with:
          name: painel-rh-windows
          path: painel-rh/saida/*

      - name: Publicar versão (somente em tag)
        if: startsWith(github.ref, 'refs/tags/painel-rh-v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: painel-rh/saida/*
